<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer rotated square -->
  <rect x="8" y="8" width="48" height="48" rx="10" fill="url(#gradient)" transform="rotate(3 32 32)"/>
  <!-- Inner white square -->
  <rect x="12" y="12" width="40" height="40" rx="8" fill="#FDFCFA"/>
  <!-- Center accent square -->
  <rect x="24" y="24" width="16" height="16" rx="3" fill="url(#gradient)"/>
  
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#276749"/>
      <stop offset="100%" stop-color="#1C5239"/>
    </linearGradient>
  </defs>
</svg>