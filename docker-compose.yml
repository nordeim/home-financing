# ══════════════════════════════════════════════════════════════════
# Home Financing — Local Development Services
# ══════════════════════════════════════════════════════════════════
# Usage:
#   Start:   docker compose up -d
#   Stop:    docker compose down
#   Reset:   docker compose down -v  (WARNING: deletes all data)
#   Logs:    docker compose logs -f postgres
# ══════════════════════════════════════════════════════════════════

services:
  # ─── PostgreSQL 17 ───────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: home_financing_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: home_financing_dev
      POSTGRES_USER: home_financing_user
      POSTGRES_PASSWORD: home_financing_secret
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5434:5432"
    volumes:
      - home_financing_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U home_financing_user -d home_financing_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - home_financing_net

# ─── Named Volumes ─────────────────────────────────────────────────
volumes:
  home_financing_data:
    driver: local

# ─── Networks ──────────────────────────────────────────────────────
networks:
  home_financing_net:
    driver: bridge
